<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Strategic Finance">
  <defs>
    <radialGradient id="w" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#eef0f3"/><stop offset="1" stop-color="#c9ced6"/>
    </radialGradient>
    <radialGradient id="b" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#4a5a75"/><stop offset=".45" stop-color="#14233c"/><stop offset="1" stop-color="#0a1322"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c78c"/><stop offset="1" stop-color="#d2a865"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.028" numOctaves="3" seed="11" result="n"/>
      <feComponentTransfer in="n" result="bands"><feFuncR type="table" tableValues="0 .2 1 .3 0 .2 1 .3 0"/></feComponentTransfer>
      <feColorMatrix in="bands" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.27  0 0 0 0 0.10  0.60 0 0 0 0" result="b"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.6" numOctaves="2" seed="5" result="f"/>
      <feColorMatrix in="f" type="matrix" values="0 0 0 0 0.40  0 0 0 0 0.24  0 0 0 0 0.08  0 0 0 0.7 -0.22" result="fib"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="fib"/></feMerge>
    </filter>
    <clipPath id="tile"><rect width="120" height="120" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="120" height="120" fill="url(#wood)"/>
    <rect width="120" height="120" filter="url(#grain)"/>
  </g>
  <g stroke="#3a2a17" stroke-width="2.5" stroke-linecap="square">
    <line x1="35" y1="4" x2="35" y2="116"/><line x1="85" y1="4" x2="85" y2="116"/>
    <line x1="4" y1="35" x2="116" y2="35"/><line x1="4" y1="85" x2="116" y2="85"/>
  </g>
  <circle cx="35" cy="35" r="23.5" fill="url(#w)" stroke="#9aa3b0" stroke-width="1"/>
  <circle cx="85" cy="35" r="23.5" fill="url(#b)"/>
  <circle cx="35" cy="85" r="23.5" fill="url(#b)"/>
  <circle cx="85" cy="85" r="23.5" fill="url(#w)" stroke="#9aa3b0" stroke-width="1"/>
</svg>
